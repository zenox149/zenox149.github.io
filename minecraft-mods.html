<!DOCTYPE html>
<html>
<head>
    <title>Minecraft Download Hub</title>

    <style>
    body {
        text-align: center;
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
    }

    h1 {
        margin-top: 60px;
        font-size: 50px;
    }

    button {
        font-size: 28px;
        padding: 20px 40px;
        margin: 20px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        width: 80%;
        max-width: 400px;
    }

    #countdown {
        font-size: 30px;
        margin-top: 30px;
        color: red;
    }
    </style>
</head>

<body>

<h1>Minecraft Download Hub</h1>

<button onclick="startDownload('https://www.curseforge.com/minecraft/mc-mods')">
Download Mods
</button>

<button onclick="startDownload('https://www.curseforge.com/minecraft/customization')">
Download Shaders
</button>

<button onclick="startDownload('https://www.planetminecraft.com/texture-packs/')">
Download Texture Packs
</button>

<div id="countdown"></div>

<script>
function startDownload(link) {
    let timeLeft = 10;

    document.getElementById("countdown").innerHTML =
        "Please wait " + timeLeft + " seconds...";

    let timer = setInterval(function() {
        timeLeft--;

        document.getElementById("countdown").innerHTML =
            "Please wait " + timeLeft + " seconds...";

        if (timeLeft <= 0) {
            clearInterval(timer);
            document.getElementById("countdown").innerHTML =
                "Opening Download...";

            // Same tab redirect (NO popup block)
            window.location.href = link;
        }

    }, 1000);
}
</script>

</body>
</html>
